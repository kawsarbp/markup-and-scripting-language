<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to DIU Bus Tracker to track your Dhaka International University shuttle in real-time.">
    <title>DIU Bus Tracker - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="bg-blobs">
    <div class="blob animate-float" style="width: 24rem; height: 24rem; background: rgba(0, 104, 56, 0.1); top: -12rem; left: -12rem;"></div>
    <div class="blob animate-float-slow" style="width: 20rem; height: 20rem; background: rgba(0, 166, 81, 0.1); top: 33%; right: -8rem; animation-delay: -3s;"></div>
    <div class="blob animate-float" style="width: 16rem; height: 16rem; background: rgba(255, 140, 0, 0.1); bottom: -8rem; left: 25%; animation-delay: -6s;"></div>
    <div class="blob animate-float-slow" style="width: 18rem; height: 18rem; background: rgba(0, 104, 56, 0.1); bottom: 25%; right: -5rem; animation-delay: -9s;"></div>
</div>

<nav class="navbar">
    <div class="nav-inner">
        <a href="index.html" class="nav-logo">
            <div class="nav-logo-icon gradient-bg">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
            </div>
            <span class="nav-logo-text">DIU <span class="gradient-text">Bus Tracker</span></span>
        </a>

        <a href="index.html" class="nav-home">
            <svg viewBox="0 0 24 24">
                <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Home
        </a>
    </div>
</nav>

<div class="auth-area">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo gradient-bg">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
            </div>
            <h2 class="auth-title">Welcome Back!</h2>
            <p class="auth-subtitle">Sign in to track your DIU shuttle in real-time</p>
        </div>

        <div class="glass-card">
            <form class="form" action="#" method="post">
                <div class="field">
                    <label for="email">Email</label>
                    <div class="input-wrap">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <input class="input input-with-icon" id="email" type="email" name="email" placeholder="Enter your email" required autocomplete="username" autofocus>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                        <input class="input input-with-icon input-with-eye" id="password" type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="eye-btn" onclick="togglePassword()" aria-label="Toggle password visibility">
                            <svg id="eye-icon" viewBox="0 0 24 24">
                                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label" for="remember_me">
                        <input id="remember_me" type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a class="link" href="#">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <p class="card-footer">
                Don't have an account?
                <a class="link" href="register.html">Create one</a>
            </p>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
